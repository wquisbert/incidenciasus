<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDES LA PAZ / SUISD - Consolidado de Reportes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sedesDarkRed: '#991b1b',
                        sedesRed: '#dc2626',
                        sedesYellow: '#f59e0b',
                        institucional: '#0056b3',
                    }
                }
            }
        }
    </script>
    <style>
        .no-cortar { page-break-inside: avoid; break-inside: avoid; }
        .bg-pattern { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 20px 20px; }
        .glass-header { background: rgba(153, 27, 27, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-pattern min-h-screen p-3 sm:p-6 md:p-10 flex items-center justify-center font-sans">

    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden border-b-8 border-sedesYellow relative">
        
        <div class="glass-header p-6 sm:p-10 text-white relative">
            <div class="absolute top-0 right-0 p-4 opacity-20">
                <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            </div>
            <div class="relative z-10 flex flex-col sm:flex-row items-center justify-between gap-6">
                <div class="text-center sm:text-left">
                    <h1 class="text-3xl sm:text-4xl font-black tracking-tighter">SEDES LA PAZ</h1>
                    <div class="flex items-center justify-center sm:justify-start gap-2 mt-1">
                        <span class="h-1 w-10 bg-sedesYellow rounded-full"></span>
                        <p class="text-sedesYellow font-bold uppercase tracking-widest text-sm">Unidad SUISD</p>
                    </div>
                </div>
                <div class="bg-white/10 backdrop-blur-md border border-white/20 px-6 py-2 rounded-2xl text-center">
                    <p class="text-xs font-bold uppercase opacity-80">Registro de</p>
                    <p class="text-xl font-black tracking-widest">INCIDENCIAS</p>
                </div>
            </div>
        </div>

        <div class="p-6 sm:p-10">
            <form id="incidenciaForm" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-black text-gray-700 uppercase flex items-center gap-2">
                            <span class="w-2 h-2 bg-sedesYellow rounded-full"></span> Sistema con Incidencia <span class="text-sedesRed">*</span>
                        </label>
                        <select id="sistema" class="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl p-4 outline-none focus:border-sedesDarkRed transition-all font-medium text-gray-800" required>
                            <option value="" disabled selected>Seleccione el sistema...</option>
                            <option value="MICITA CERO FILAS WEB">MICITA CERO FILAS WEB</option>
                            <option value="SICE 700 / MICITA CERO FILAS">SICE 700 / MICITA CERO FILAS</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-black text-gray-700 uppercase flex items-center gap-2">
                            <span class="w-2 h-2 bg-sedesYellow rounded-full"></span> Establecimiento <span class="text-sedesRed">*</span>
                        </label>
                        <input type="text" id="establecimiento" placeholder="Nombre del Centro de Salud / Hospital" class="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl p-4 outline-none focus:border-sedesDarkRed transition-all font-medium" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-black text-gray-700 uppercase flex items-center gap-2">
                        <span class="w-2 h-2 bg-sedesYellow rounded-full"></span> Descripción Técnica <span class="text-sedesRed">*</span>
                    </label>
                    <textarea id="descripcion" rows="4" placeholder="Detalle la falla o incidencia encontrada..." class="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl p-4 outline-none focus:border-sedesDarkRed transition-all font-medium" required></textarea>
                </div>

                <div class="bg-gray-50 rounded-3xl p-6 sm:p-8 border-2 border-dashed border-gray-200 relative group transition-all hover:border-sedesYellow">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-sm font-black text-gray-700 uppercase tracking-wider">Evidencia Fotográfica <span class="text-sedesRed">*</span></h3>
                        <span id="contador" class="bg-sedesDarkRed text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-lg">0 / 3</span>
                    </div>
                    
                    <input type="file" id="imagenesInput" accept="image/*" multiple class="hidden">
                    <button type="button" onclick="document.getElementById('imagenesInput').click()" class="w-full bg-white border-2 border-gray-200 py-6 rounded-2xl font-black text-gray-500 hover:text-sedesDarkRed hover:bg-white hover:shadow-xl transition-all flex flex-col items-center gap-2">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        SUBIR IMÁGENES DE RESPALDO (Hasta 3 imagenes)
                    </button>
                    
                    <div id="previewContainer" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mt-6 hidden"></div>
                </div>

                <div class="pt-4">
                    <button type="submit" id="btnEnviar" class="w-full bg-gradient-to-r from-sedesDarkRed to-sedesRed text-white font-black text-lg py-5 rounded-2xl shadow-xl hover:shadow-sedesRed/40 transition-all flex justify-center items-center gap-3 active:scale-95 group">
                        <span class="group-hover:rotate-12 transition-transform">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </span>
                        PROCESAR REPORTE
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="fixed top-0 left-0 w-[800px] -z-50 opacity-0 pointer-events-none">
        <div id="pdfTemplate" class="bg-white px-12 py-10 font-sans text-gray-800">
            <div class="w-full h-4 flex mb-8">
                <div class="w-2/3 bg-sedesDarkRed h-full"></div>
                <div class="w-1/3 bg-sedesYellow h-full"></div>
            </div>
            <div class="text-center border-b-4 border-sedesDarkRed pb-6 mb-8 uppercase">
                <p class="text-xs font-bold text-gray-500 tracking-widest mb-1">Servicio Departamental de Salud - La Paz</p>
                <h1 class="text-3xl font-black text-gray-800">Reporte de Incidencias</h1>
                <h2 class="text-xl font-bold mt-1 text-sedesDarkRed">Unidad SUISD</h2>
            </div>
            <div class="bg-gray-100 p-6 rounded-2xl mb-10 text-sm uppercase grid grid-cols-2 gap-6 font-bold border-l-8 border-sedesYellow">
                <div><p class="text-sedesDarkRed text-xs mb-1">Fecha de Registro</p><span id="pdfFecha"></span></div>
                <div><p class="text-sedesDarkRed text-xs mb-1">Sistema</p><span id="pdfSistema"></span></div>
                <div class="col-span-2"><p class="text-sedesDarkRed text-xs mb-1">Establecimiento Notificador</p><span id="pdfEstablecimiento"></span></div>
            </div>
            <div class="mb-12 no-cortar">
                <h3 class="font-black text-lg border-b-2 border-gray-200 mb-5 pb-2 text-sedesDarkRed uppercase italic">Descripción de la Supervisión</h3>
                <div class="border-2 border-gray-100 p-8 rounded-3xl bg-gray-50/50"><p id="pdfDescripcion" class="text-base leading-relaxed text-justify whitespace-pre-wrap"></p></div>
            </div>
            <div id="pdfImages" class="flex flex-col gap-12 mb-12"></div>
            
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdO1-v0txjaMXEZbUf-1svczUUCRU1y3Ei8JRl6lhLyIcyeIifqOScTEiGta3LGzSo/exec'; 
        const form = document.getElementById('incidenciaForm');
        const inputImagenes = document.getElementById('imagenesInput');
        const previewContainer = document.getElementById('previewContainer');
        const btnEnviar = document.getElementById('btnEnviar');
        let imageFiles = []; 

        inputImagenes.onchange = (e) => {
            Array.from(e.target.files).forEach(f => { if (imageFiles.length < 3) imageFiles.push(f); });
            actualizarUI();
            inputImagenes.value = ''; 
        };

        function actualizarUI() {
            previewContainer.innerHTML = '';
            previewContainer.classList.toggle('hidden', imageFiles.length === 0);
            document.getElementById('contador').textContent = `${imageFiles.length} / 3`;
            imageFiles.forEach((f, i) => {
                const rd = new FileReader();
                rd.onload = (ev) => {
                    const div = document.createElement('div');
                    div.className = 'relative animate-pulse-once';
                    div.innerHTML = `<img src="${ev.target.result}" class="w-full h-32 object-cover rounded-2xl border-4 border-white shadow-lg">
                                     <button type="button" onclick="quitar(${i})" class="absolute -top-3 -right-3 bg-sedesRed text-white rounded-full w-8 h-8 flex items-center justify-center font-black shadow-xl border-2 border-white">×</button>`;
                    previewContainer.appendChild(div);
                };
                rd.readAsDataURL(f);
            });
        }

        window.quitar = (i) => { imageFiles.splice(i, 1); actualizarUI(); };

        form.onsubmit = async (e) => {
            e.preventDefault();
            if(imageFiles.length === 0) return Swal.fire({ icon: 'warning', title: 'Falta Evidencia', text: 'Adjunte al menos una imagen para el informe técnico.', confirmButtonColor: '#991b1b' });

            const sist = document.getElementById('sistema').value;
            const est = document.getElementById('establecimiento').value;
            const desc = document.getElementById('descripcion').value;
            const nombrePdf = `SUISD_${sist}_${est.replace(/ /g, '_')}.pdf`;
            
            document.getElementById('pdfFecha').textContent = new Date().toLocaleString('es-BO');
            document.getElementById('pdfSistema').textContent = sist;
            document.getElementById('pdfEstablecimiento').textContent = est;
            document.getElementById('pdfDescripcion').textContent = desc;

            const pdfImgBox = document.getElementById('pdfImages');
            const arrayBase64 = [];
            pdfImgBox.innerHTML = '';
            
            for (let f of imageFiles) {
                const b64 = await new Promise(r => { const rd = new FileReader(); rd.onload = ev => r(ev.target.result); rd.readAsDataURL(f); });
                arrayBase64.push(b64);
                pdfImgBox.innerHTML += `<div class="w-full h-[500px] flex justify-center items-center bg-gray-50 border-4 border-gray-100 rounded-3xl p-4 no-cortar shadow-inner">
                                         <img src="${b64}" class="max-w-full max-h-full object-contain rounded-xl shadow-lg"></div>`;
            }

            btnEnviar.disabled = true;
            btnEnviar.innerHTML = '⚙️ ENVIANDO INFORMACIÓN...';

            const opt = { margin: [15, 10, 15, 10], filename: nombrePdf, image: { type: 'jpeg', quality: 0.98 }, 
                          html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'legal', orientation: 'portrait' },
                          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ sistema: sist, establecimiento: est, descripcion: desc, imagenes: arrayBase64, nombre: nombrePdf })
                });

                html2pdf().set(opt).from(document.getElementById('pdfTemplate')).save();

                Swal.fire({
                    title: '¡Consolidación Exitosa!',
                    html: 'El PDF ha sido generado.<br><br>Copia enviada a la base de datos de <b>SUISD / SEDES LA PAZ</b>.',
                    icon: 'success',
                    confirmButtonColor: '#991b1b',
                    confirmButtonText: 'FINALIZAR'
                }).then(() => {
                    form.reset(); imageFiles = []; actualizarUI();
                    btnEnviar.disabled = false; btnEnviar.innerHTML = 'PROCESAR REPORTE';
                });

            } catch (err) {
                Swal.fire('Error de Red', 'El PDF se generó localmente y tambien se envio a la unidad de SUISD.', 'error');
                btnEnviar.disabled = false;
            }
        };
    </script>
</body>
</html>
