<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDES LA PAZ / SUISD - Registro de Incidencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        institucional: '#0056b3', 
                        decorativo: '#dc2626',   
                        sedesYellow: '#f59e0b',  
                    }
                }
            }
        }
    </script>
    <style>
        .no-cortar {
            page-break-inside: avoid;
            break-inside: avoid;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-6 md:p-8 font-sans relative overflow-x-hidden">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden border-t-8 border-decorativo relative z-10">
        
        <div class="border-b pb-5 sm:pb-6 p-5 sm:p-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-wider">SEDES LA PAZ / SUISD</h1>
                <p class="text-institucional text-sm sm:text-base font-semibold mt-1">Generador de Informe de Incidencia</p>
            </div>
            <div>
                <span class="bg-blue-100 text-institucional text-xs sm:text-sm font-semibold px-4 py-1.5 rounded-full shadow-sm">La Paz</span>
            </div>
        </div>

        <div class="p-5 sm:p-8">
            <form id="incidenciaForm" class="space-y-5 sm:space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5 sm:mb-2">Sistema</label>
                    <select id="sistema" class="w-full border-2 border-gray-200 rounded-lg p-2.5 sm:p-3 focus:ring-0 focus:border-institucional transition-colors text-sm sm:text-base bg-white" required>
                        <option value="" disabled selected>Seleccione un sistema...</option>
                        <option value="MICITA CERO FILAS WEB">MICITA CERO FILAS WEB</option>
                        <option value="SICE/MICITA">SICE/MICITA</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5 sm:mb-2">Establecimiento de Salud Notificador</label>
                    <input type="text" id="establecimiento" placeholder="Ej. Hospital de Clínicas" class="w-full border-2 border-gray-200 rounded-lg p-2.5 sm:p-3 focus:ring-0 focus:border-institucional transition-colors text-sm sm:text-base" required>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5 sm:mb-2">Descripción de la Incidencia</label>
                    <textarea id="descripcion" rows="4" sm:rows="5" placeholder="Detalle el problema encontrado..." class="w-full border-2 border-gray-200 rounded-lg p-2.5 sm:p-3 focus:ring-0 focus:border-institucional transition-colors text-sm sm:text-base" required></textarea>
                </div>

                <div class="bg-gray-50 p-4 sm:p-5 rounded-lg border border-gray-200">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 sm:mb-4 gap-2">
                        <label class="block text-sm font-bold text-gray-800">Evidencia Fotográfica (Obligatorio, máx. 3)</label>
                        <span id="contadorImagenes" class="text-xs font-bold bg-white text-institucional px-2 py-1 rounded border border-institucional">0 / 3</span>
                    </div>
                    
                    <input type="file" id="imagenesInput" accept="image/*" multiple class="hidden">
                    
                    <button type="button" id="btnAgregarImagen" class="w-full bg-white border-2 border-dashed border-gray-300 text-gray-600 hover:bg-gray-100 font-bold py-3 sm:py-3.5 rounded-lg transition-colors flex justify-center items-center text-sm sm:text-base active:bg-gray-200">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Agregar Imagen
                    </button>
                    
                    <div id="previewContainer" class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4 mt-4 hidden"></div>
                </div>

                <div class="pt-4 sm:pt-6 border-t border-gray-200">
                    <button type="submit" class="w-full bg-decorativo hover:bg-red-700 text-white font-bold text-base sm:text-lg py-3.5 sm:py-4 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 flex justify-center items-center active:scale-[0.98]">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        GENERAR REPORTE PDF
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="fixed top-0 left-0 w-[800px] -z-50 opacity-0 pointer-events-none max-w-none">
        <div id="pdfTemplate" class="bg-white px-10 py-8 font-sans text-gray-800">
            
            <div class="w-full h-3 flex mb-8">
                <div class="w-2/3 bg-decorativo h-full"></div>
                <div class="w-1/3 bg-sedesYellow h-full"></div>
            </div>

            <div class="text-center border-b-2 border-decorativo pb-5 mb-8">
                <h1 class="text-3xl font-black uppercase tracking-widest text-gray-800">REPORTE DE INCIDENCIAS</h1>
                <h2 class="text-xl font-bold mt-2 text-gray-700">SEDES LA PAZ / SUISD</h2>
            </div>

            <div class="bg-gray-50 border border-gray-200 p-5 rounded-lg mb-8 shadow-sm">
                <div class="grid grid-cols-2 gap-y-3 gap-x-6 text-sm">
                    <div><span class="font-bold text-decorativo">FECHA Y HORA:</span> <span id="pdfFecha" class="ml-2 text-gray-700"></span></div>
                    <div><span class="font-bold text-decorativo">SISTEMA CON INCIDENCIA:</span> <span id="pdfSistema" class="ml-2 font-semibold text-gray-800"></span></div>
                    <div class="col-span-2"><span class="font-bold text-decorativo">ESTABLECIMIENTO NOTIFICADOR:</span> <span id="pdfEstablecimiento" class="ml-2 font-semibold text-gray-800 uppercase"></span></div>
                </div>
            </div>

            <div class="mb-10 no-cortar">
                <h3 class="font-bold text-lg border-b border-gray-300 mb-4 pb-1 text-decorativo">Descripción de la Incidencia</h3>
                <div class="border-2 border-decorativo p-6 rounded-md bg-white">
                    <p id="pdfDescripcion" class="text-base leading-relaxed text-justify whitespace-pre-wrap text-gray-800 min-h-[120px]"></p>
                </div>
            </div>

            <div class="mb-6 no-cortar">
                <h3 class="font-bold text-lg border-b border-gray-300 mb-2 pb-1 text-decorativo">Evidencia Fotográfica</h3>
            </div>

            <div id="pdfImages" class="flex flex-col gap-8 mb-12">
                </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('incidenciaForm');
        const inputImagenes = document.getElementById('imagenesInput');
        const btnAgregarImagen = document.getElementById('btnAgregarImagen');
        const previewContainer = document.getElementById('previewContainer');
        const contadorImagenes = document.getElementById('contadorImagenes');
        
        let imageFiles = []; 

        btnAgregarImagen.addEventListener('click', () => {
            if (imageFiles.length < 3) {
                inputImagenes.click();
            }
        });

        inputImagenes.addEventListener('change', (e) => {
            const archivosNuevos = Array.from(e.target.files);
            
            archivosNuevos.forEach(file => {
                if (imageFiles.length < 3) {
                    imageFiles.push(file); 
                }
            });
            
            actualizarVistaPrevia();
            inputImagenes.value = ''; 
        });

        function actualizarVistaPrevia() {
            previewContainer.innerHTML = '';
            
            if (imageFiles.length > 0) {
                previewContainer.classList.remove('hidden');
            } else {
                previewContainer.classList.add('hidden');
            }

            contadorImagenes.textContent = `${imageFiles.length} / 3`;

            if (imageFiles.length >= 3) {
                btnAgregarImagen.classList.add('opacity-50', 'cursor-not-allowed');
                btnAgregarImagen.textContent = "Límite de 3 imágenes alcanzado";
            } else {
                btnAgregarImagen.classList.remove('opacity-50', 'cursor-not-allowed');
                btnAgregarImagen.innerHTML = `<svg class="w-5 h-5 mr-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Agregar Imagen`;
            }

            imageFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const div = document.createElement('div');
                    div.className = 'relative group';
                    
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    // Ajuste de altura en vista previa según pantalla
                    img.className = 'w-full h-20 sm:h-24 object-cover rounded-md border border-gray-200 shadow-sm';
                    
                    const btnEliminar = document.createElement('button');
                    btnEliminar.innerHTML = '×';
                    // Botón de eliminar un poco más amigable para el dedo en móviles
                    btnEliminar.className = 'absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-7 h-7 flex items-center justify-center font-bold hover:bg-red-800 shadow-lg pb-0.5';
                    btnEliminar.onclick = (e) => {
                        e.preventDefault();
                        imageFiles.splice(index, 1);
                        actualizarVistaPrevia(); 
                    };

                    div.appendChild(img);
                    div.appendChild(btnEliminar);
                    previewContainer.appendChild(div);
                }
                reader.readAsDataURL(file);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if(imageFiles.length === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Faltan Imágenes',
                    text: 'Por favor, adjunte al menos una imagen de evidencia para generar el informe.',
                    confirmButtonColor: '#dc2626'
                });
                return;
            }

            const sistema = document.getElementById('sistema').value;
            const establecimiento = document.getElementById('establecimiento').value;
            const descripcion = document.getElementById('descripcion').value;
            const fechaActual = new Date().toLocaleDateString('es-BO', { 
                year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' 
            });

            document.getElementById('pdfFecha').textContent = fechaActual.toUpperCase();
            document.getElementById('pdfSistema').textContent = sistema;
            document.getElementById('pdfEstablecimiento').textContent = establecimiento;
            document.getElementById('pdfDescripcion').textContent = descripcion;

            const pdfImagesContainer = document.getElementById('pdfImages');
            pdfImagesContainer.innerHTML = ''; 
            
            for (let i = 0; i < imageFiles.length; i++) {
                const reader = new FileReader();
                const imageData = await new Promise((resolve) => {
                    reader.onload = (event) => resolve(event.target.result);
                    reader.readAsDataURL(imageFiles[i]);
                });
                
                const imgWrapper = document.createElement('div');
                imgWrapper.className = 'w-full h-[450px] flex justify-center items-center bg-gray-50 border border-gray-300 rounded-lg p-2 no-cortar shadow-sm';
                
                const imgTag = document.createElement('img');
                imgTag.src = imageData;
                imgTag.className = 'max-w-full max-h-full object-contain rounded'; 
                
                imgWrapper.appendChild(imgTag);
                pdfImagesContainer.appendChild(imgWrapper);
            }

            const elemento = document.getElementById('pdfTemplate');
            
            const opciones = {
                margin:       [10, 5, 10, 5], 
                filename:     `Reporte_SUISD_${establecimiento.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'legal', orientation: 'portrait' }, // TAMAÑO OFICIO
                pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
            };

            const btnSubmit = form.querySelector('button[type="submit"]');
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '⚙️ GENERANDO DOCUMENTO...';
            btnSubmit.classList.replace('bg-decorativo', 'bg-sedesYellow');
            btnSubmit.disabled = true;

            html2pdf().set(opciones).from(elemento).save().then(() => {
                btnSubmit.innerHTML = originalText;
                btnSubmit.classList.replace('bg-sedesYellow', 'bg-decorativo');
                btnSubmit.disabled = false;

                Swal.fire({
                    title: '¡Informe Generado!',
                    text: 'El informe PDF de supervisión se ha descargado correctamente.',
                    icon: 'success',
                    confirmButtonColor: '#0056b3',
                    confirmButtonText: 'Aceptar'
                }).then((result) => {
                    if (result.isConfirmed || result.isDismissed) {
                        form.reset(); 
                        imageFiles = []; 
                        actualizarVistaPrevia(); 
                    }
                });
            });
        });
    </script>
</body>
</html>
